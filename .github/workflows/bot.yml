name: Regay Islam Telegram Bot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regay-islam-runtime
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 345

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify required secrets are present
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python - <<'PY'
          import os, sys
          required = ("BOT_TOKEN", "ADMIN_IDS", "SUPABASE_URL", "SUPABASE_SERVICE_ROLE_KEY")
          missing = [key for key in required if not os.getenv(key)]
          for key in required:
              print(f"{key}: {'MISSING' if key in missing else 'OK'}")
          if missing:
              sys.exit("Required GitHub Actions secrets are missing; values were not printed.")
          PY

      - name: Run bot with persistent logs
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TIMEZONE: Asia/Baghdad
          LOG_LEVEL: INFO
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          python -u bot.py 2>&1 | tee -a bot.log

      - name: Upload bot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regay-islam-bot-logs-${{ github.run_id }}
          path: bot.log
          if-no-files-found: warn
          retention-days: 7
